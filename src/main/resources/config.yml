# Как часто проверять баланс игрока и сравнивать с прошлым значением (в тиках, 20 = 1 сек)
balance-check-interval-ticks: 10

# Как часто перерисовывать actionbar (в тиках). Чем меньше - тем плавнее анимация иконки.
render-interval-ticks: 1

# Длительность анимации получения валюты, в миллисекундах
animation-duration-ms: 2000

# --- Выравнивание через невидимые спейсер-символы (метод money.js) ---
# Базовые пиксельные ширины глифов. Без явного "width" в font-json'ах
# (actionbar.json/actionbar_1.json/actionbar_2.json) Minecraft сам обрезает
# прозрачные пиксели и считает ширину по факту - эти значения лишь стартовая
# оценка, подгони их в игре под реальную картинку (как ты делал с money.js).
glyph-widths:
  digit: 5
  dot: 1
  suffix: 5
  dollar-icon: 16
  ares-icon: 16

# --- Сдвиг actionbar обычными пробелами ---
# Ванильный actionbar центрируется по ширине текста.
# trailing-spaces: пробелы В КОНЕЦ строки -> расширяют строку справа,
#   из-за центрирования видимый контент уезжает ВЛЕВО. Увеличивай, чтобы сдвинуть левее.
# leading-spaces: пробелы В НАЧАЛО строки -> сдвигают контент ВПРАВО.
actionbar-align:
  leading-spaces: 0
  trailing-spaces: 46

# Ручная калибровка (px) по длине строки цифр (без иконки) - аналог
# dolShiftMap/areShiftMap из money.js. "default" - если для конкретной длины
# нет отдельного значения.
shift-calibration:
  dollar:
    default: 1
    2: 1
    3: 1
    4: 1
    5: 1
    6: 27
    7: 33
    8: 39
  ares:
    default: 6
    2: 5
    3: 4
    4: 3
    5: 2

# Прямая калибровка ПОЛНОЙ ширины блока (иконка+цифры) по длине строки цифр.
# Если для конкретной длины задано значение здесь - оно используется ВМЕСТО
# суммы glyph-widths.* (иконка + digit*N + suffix/dot) и полностью убирает
# накопление ошибки при росте числа цифр (та самая проблема "иконка
# смещается при добавлении символа").
#
# Как откалибровать: ставь себе баланс с разным кол-вом символов (0, 9, 10,
# 99, 100, 999, 1000 -> "1.0K" и т.д.) и для каждой длины подбирай число,
# при котором иконка долларов/аресов не двигается от предыдущей длины.
# Пример (раскомментируй и впиши свои значения):
# block-width:
#   dollar:
#     1: 15
#     2: 21
#     3: 27
#   ares:
#     1: 15
#     2: 21
block-width:
  dollar: {}
  ares: {}

# Namespace ресурспака, в котором лежат кастомные шрифты
# (assets/<namespace>/font/actionbar.json, actionbar_1.json, actionbar_2.json)
font-namespace: minecraft

# Шрифт цифр для баланса долларов
dollar-digit-font: actionbar_1

# Шрифт цифр для баланса аресов
ares-digit-font: actionbar_2