# Как часто проверять баланс игрока и сравнивать с прошлым значением (в тиках, 20 = 1 сек)
# (теперь тут же опрашивается и уровень/опыт - см. секцию level ниже)
balance-check-interval-ticks: 10

# Как часто перерисовывать actionbar (в тиках). Чем меньше - тем плавнее анимация иконки.
render-interval-ticks: 1

# Длительность анимации получения валюты, в миллисекундах
animation-duration-ms: 2000

# --- Выравнивание через невидимые спейсер-символы (метод money.js) ---
# Базовые пиксельные ширины глифов. Без явного "width" в font-json'ах
# (actionbar.json/actionbar_1.json/actionbar_2.json) Minecraft сам обрезает
# прозрачные пиксели и считает ширину по факту - эти значения лишь стартовая
# оценка, подгони их в игре под реальную картинку (как ты делал с money.js).
glyph-widths:
  digit: 5
  dot: 1
  suffix: 5
  dollar-icon: 16
  ares-icon: 16

# --- Сдвиг actionbar обычными пробелами ---
# Ванильный actionbar центрируется по ширине текста.
# trailing-spaces: пробелы В КОНЕЦ строки -> расширяют строку справа,
#   из-за центрирования видимый контент уезжает ВЛЕВО. Увеличивай, чтобы сдвинуть левее.
# leading-spaces: пробелы В НАЧАЛО строки -> сдвигают контент ВПРАВО.
actionbar-align:
  leading-spaces: 0
  trailing-spaces: 46

# Ручная калибровка (px) по длине строки цифр (без иконки) - аналог
# dolShiftMap/areShiftMap из money.js. "default" - если для конкретной длины
# нет отдельного значения.
shift-calibration:
  dollar:
    default: 1
    2: 1
    3: 1
    4: 1
    5: 1
    6: 27
    7: 33
    8: 39
  ares:
    default: 6
    2: 5
    3: 4
    4: 3
    5: 2

# Прямая калибровка ПОЛНОЙ ширины блока (иконка+цифры) по длине строки цифр.
# Если для конкретной длины задано значение здесь - оно используется ВМЕСТО
# суммы glyph-widths.* (иконка + digit*N + suffix/dot) и полностью убирает
# накопление ошибки при росте числа цифр (та самая проблема "иконка
# смещается при добавлении символа").
#
# Как откалибровать: ставь себе баланс с разным кол-вом символов (0, 9, 10,
# 99, 100, 999, 1000 -> "1.0K" и т.д.) и для каждой длины подбирай число,
# при котором иконка долларов/аресов не двигается от предыдущей длины.
# Пример (раскомментируй и впиши свои значения):
# block-width:
#   dollar:
#     1: 15
#     2: 21
#     3: 27
#   ares:
#     1: 15
#     2: 21
block-width:
  dollar: {}
  ares: {}

# Namespace ресурспака, в котором лежат кастомные шрифты
# (assets/<namespace>/font/actionbar.json, actionbar_1.json, actionbar_2.json)
font-namespace: minecraft

# Шрифт цифр для баланса долларов
dollar-digit-font: actionbar_1

# Шрифт цифр для баланса аресов
ares-digit-font: actionbar_2

# --- Уровень сервера (раньше - костыль через PlaceholderAPI JS-expansion level.js) ---
# Шкала опыта: шрифт assets/<namespace>/font/actionbar_3.json
# (51 кадр, chars A..Z,a..y -> font/xp/0.png..100.png, шаг 2% на кадр).
# Число уровня переиспользует уже существующий digit-font (actionbar_1).
# Иконка уровня - анимированная (16 кадров others/exp_anim/*.png, символы
# 'a'..'p' в actionbar.json - том же файле, где анимации долларов/аресов);
# логика анимации идентична им: статичный кадр в покое, проигрывание всех
# 16 кадров при росте опыта. Больше не используется статичный 'z'-значок.
level:
  enabled: true

  # Диагностика: раз в 5 сек пишет в консоль сырые значения плейсхолдеров
  # %lamglevels_level% / %lamglevels_exp_progress% и что из них посчиталось
  # (уровень, опыт, цель, процент, символ шкалы). Включи, если шкала не двигается.
  debug: false

  font-namespace: minecraft
  digit-font: actionbar_1
  xp-bar-font: actionbar_3

  # Длительность анимации иконки получения опыта, в миллисекундах - как
  # animation-duration-ms для долларов/аресов, но отдельно (у иконки опыта
  # 16 кадров вместо 11, может потребоваться другая скорость).
  exp-animation-duration-ms: 2000

  # Ширина одного глифа цифры уровня в px - аналог "9" в getWidth() из
  # старого level.js (getWidth(text) = text.length * 9 - 1).
  digit-width: 9.0

  # Геометрия блока - 1:1 перенос констант из result() старого level.js.
  # Подгони в игре под реальную картинку, как с shift-calibration выше.
  # ВАЖНО: icon-width раньше калибровалась под статичную картинку 'z'
  # (font/level_icon.png) - теперь иконка анимированная (others/exp_anim/*.png,
  # другие пропорции), ширину почти наверняка нужно подобрать заново.
  bar-width: 30.0
  icon-width: 6.0
  icon-spacing: 1.0
  margin: -6.0
  bar-nudge: -1.5

  # Сдвиг влево группы "число уровня + иконка" ЦЕЛИКОМ, в пикселях - шкалу
  # опыта не трогает. Значение всегда положительное - направление "влево"
  # задано самой формулой, а не знаком числа (как posSpace/negSpace в
  # money.js/level.js).
  digit-nudge: 0.0

  # Сколько опыта нужно набрать, чтобы перейти с текущего уровня на следующий.
  # НЕ формула (level+1)*70 из старого level.js - та не совпадала с реальной
  # системой опыта. Подобрано по факту:
  #   уровень 0 (ещё не прокачан) -> first-level-goal (25)
  #   уровень 1 и выше            -> level * increment (70, 140, 210, ...)
  # Если и эти значения не совпадут 1:1 с твоей системой опыта - поправь
  # здесь, пересобирать плагин не нужно.
  exp:
    increment: 70.0
    first-level-goal: 25.0
